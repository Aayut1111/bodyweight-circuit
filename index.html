<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodyweight Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Bodyweight Circuit</h1>
    <p class="tagline">No equipment. No excuses. Just you and a timer.</p>
  </header>

  <main id="app">
    <section id="auth-view" class="view">
  <div id="auth-logged-out" class="auth-box">
    <h2>Welcome Back</h2>
    <div class="field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <p id="auth-error" class="auth-error" hidden></p>
    <div class="auth-buttons">
      <button id="signin-btn" type="button">Sign In</button>
      <button id="signup-btn" type="button" class="secondary">Sign Up</button>
    </div>
  </div>
</section>
   <section id="setup-view" class="view" hidden>
  <div id="auth-logged-in" class="auth-box auth-bar">
    <span>Signed in as <strong id="auth-email-label"></strong></span>
    <button id="signout-btn" type="button">Sign Out</button>
  </div>
  <div id="streak-badge" class="streak-badge" hidden></div>
  <form id="setup-form">
    <!-- unchanged -->
<div id="auth-logged-in" class="auth-box" hidden>
  Signed in as <strong id="auth-email-label"></strong>
  <button id="signout-btn" type="button">Sign Out</button>
</div>
      <div id="streak-badge" class="streak-badge" hidden></div>
      <div id="settings" class="settings">
  <button id="connect-calendar-btn" type="button">Connect Google Calendar</button>
  <label class="field-inline">
    <input type="checkbox" id="calendar-sync-toggle">
    Log completed workouts to my calendar
  </label>
  <div class="field">
    <label for="reminder-time">Daily reminder time</label>
    <input type="time" id="reminder-time" value="18:00">
  </div>
  <button id="set-reminder-btn" type="button">Set recurring calendar reminder</button>
  <button id="enable-notifications-btn" type="button">Enable browser reminders</button>
</div>
      <form id="setup-form">
        <div class="field">
          <label for="duration">Duration</label>
          <select id="duration" name="duration">
            <option value="10">10 minutes</option>
            <option value="20" selected>20 minutes</option>
            <option value="30">30 minutes</option>
          </select>
        </div>
        <div class="field">
          <label for="focus">Focus</label>
          <select id="focus" name="focus">
            <option value="full" selected>Full Body</option>
            <option value="upper">Upper Body</option>
            <option value="lower">Lower Body</option>
            <option value="core">Core</option>
          </select>
        </div>
        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button type="submit" id="start-btn">Start Workout</button>
      </form>
    </section>

    <section id="workout-view" class="view" hidden>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="exercise-icon" id="exercise-icon"></div>
      <p class="phase-label" id="phase-label">WORK</p>
      <p class="exercise-name" id="exercise-name">—</p>
      <p class="exercise-instructions" id="exercise-instructions">—</p>
      <p class="timer-display" id="timer-display">00:00</p>
      <div class="timer-controls">
        <button id="pause-btn" type="button">Pause</button>
        <button id="skip-btn" type="button">Skip</button>
      </div>
    </section>

    <section id="summary-view" class="view" hidden>
      <h2>Workout Complete</h2>
      <p id="summary-stats"></p>
      <ul id="summary-list"></ul>
      <button id="restart-btn" type="button">Do Another Workout</button>
    </section>
  </main>

  <footer class="app-footer">
    <p>Built with vanilla HTML, CSS &amp; JavaScript.</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/exercises.js"></script>
<script src="js/icons.js"></script>
<script src="js/timer.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/calendar.js"></script>
<script src="js/reminders.js"></script>
<script src="js/app.js"></script>
</body>
</html>
